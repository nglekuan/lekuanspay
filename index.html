<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD43B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代收代付">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>代收代付</title>
<style>
:root{--bg:#FFF6C9;--bar:#FFD43B;--card:#FFFDF0;--ink:#3D3000;--mute:#8A7420;--line:#EBD66B;--accent:#C98F00;--ok:#5B7F1F}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bar);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px}
h1{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:.04em}
.filters{display:flex;gap:8px}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
select:focus,input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sum{margin:12px 14px;padding:12px 14px;background:var(--ink);color:#FFE680;border-radius:14px}
.sum .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sum .big{font-size:26px;font-weight:800;color:#FFD43B}
.sum small{color:#E9D88A}
.sum .pend{margin-top:6px;padding-top:6px;border-top:1px dashed #7a6a20;font-size:14px}
ul{list-style:none;margin:0;padding:0 14px}
li{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px}
li.done{border-left-color:var(--ok);opacity:.75}
.top{display:flex;justify-content:space-between;gap:8px}
.who{font-weight:800}
.amt{text-align:right;font-weight:800;white-space:nowrap}
.sub{color:var(--mute);font-size:13px}
.act{display:flex;gap:8px;margin-top:8px;align-items:center;justify-content:space-between}
.badge{font-size:13px;color:var(--ok);font-weight:700}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--bar);color:var(--ink);font-weight:700;cursor:pointer}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.danger{background:#fff;color:#a33;border:1.5px solid #e3b0b0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;font-size:32px;line-height:1;padding:0;background:var(--ink);color:var(--bar);box-shadow:0 4px 12px #0004}
.empty{text-align:center;color:var(--mute);padding:40px 20px}
.tools{display:flex;gap:8px;justify-content:center;margin:8px 14px 0}
.tools button{font-size:13px}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,440px);background:var(--bg);color:var(--ink);max-height:92vh}
dialog::backdrop{background:#0006}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px;margin-top:16px}.btns button{flex:1}
</style>
</head>
<body>
<header>
  <h1>代收代付</h1>
  <div class="filters">
    <select id="fWho" aria-label="篩選人名"></select>
    <select id="fSt" aria-label="結清狀態"><option value="">全部</option><option value="p">未結清</option><option value="d">已結清</option></select>
  </div>
</header>

<div class="sum" id="sum"></div>
<ul id="list"></ul>
<div class="tools"><button class="ghost" id="exp">匯出備份</button><button class="ghost" id="imp">匯入備份</button></div>
<input type="file" id="file" accept="application/json" hidden>
<button class="fab" id="add" aria-label="新增">+</button>

<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font-size:18px">新增</h2>
  <label>日期</label><input type="date" id="date">
  <label>待付對象</label><input id="who" list="names" placeholder="姓名" autocomplete="off">
  <datalist id="names"></datalist>
  <label>品項</label><input id="item" placeholder="例如：藥妝、伴手禮">
  <div class="two">
    <div><label>日幣（選填）</label><input id="jpy" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label>匯率（選填）</label><input id="rate" type="number" inputmode="decimal" min="0" step="any" placeholder="0.21"></div>
  </div>
  <label>台幣（填日幣＋匯率會自動計算）</label><input id="twd" type="number" inputmode="decimal" min="0" step="any">
  <label>結清日期（未結清請留空）</label><input type="date" id="paid">
  <div class="btns"><button class="ghost" id="cancel">取消</button><button id="save">儲存</button></div>
  <div class="btns" id="delRow" style="margin-top:8px"><button class="danger" id="del">刪除這筆</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const KEY='daishu-v1';
let items=[];try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('無法儲存，請檢查瀏覽器設定')}};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const n=v=>v===''||v==null?null:Number(v);
const fmt=v=>Math.round(v*100)/100;
const f=v=>fmt(v).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let editId=null;

function render(){
  const names=[...new Set(items.map(i=>i.who))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const cur=$('#fWho').value;
  $('#fWho').innerHTML='<option value="">全部人</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('');
  $('#fWho').value=names.includes(cur)?cur:'';
  $('#names').innerHTML=names.map(x=>`<option value="${esc(x)}">`).join('');
  const w=$('#fWho').value,st=$('#fSt').value;
  const rows=items.filter(i=>(!w||i.who===w)&&(!st||(st==='p'?!i.paid:!!i.paid)))
    .sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const sum=(arr,k)=>arr.reduce((s,i)=>s+(i[k]||0),0);
  const pend=rows.filter(i=>!i.paid);
  $('#sum').innerHTML=`<div class="row"><small>${w||'全部人'}・${rows.length} 筆</small><small>台幣合計</small></div>
  <div class="row"><span>日幣 ¥${f(sum(rows,'jpy'))}</span><span class="big">NT$ ${f(sum(rows,'twd'))}</span></div>
  <div class="row pend"><span>未結清 ¥${f(sum(pend,'jpy'))}</span><span>NT$ ${f(sum(pend,'twd'))}</span></div>`;
  $('#list').innerHTML=rows.length?rows.map(i=>`<li class="${i.paid?'done':''}" data-id="${i.id}">
    <div class="top"><div><div class="who">${esc(i.who)}</div><div>${esc(i.item||'')}</div></div>
    <div class="amt">NT$ ${f(i.twd||0)}${i.jpy!=null?`<div class="sub">¥${f(i.jpy)}${i.rate?` × ${i.rate}`:''}</div>`:''}</div></div>
    <div class="act"><span class="sub">${i.date}</span>
    ${i.paid?`<span class="badge">已結清 ${i.paid}</span>`:`<button data-pay="${i.id}">結清</button>`}</div></li>`).join('')
    :'<div class="empty">還沒有資料，按右下角 + 新增</div>';
}

function calc(){const j=n($('#jpy').value),r=n($('#rate').value);if(j!=null&&r!=null)$('#twd').value=Math.round(j*r)}
$('#jpy').oninput=$('#rate').oninput=calc;

function open(id){
  editId=id;const i=items.find(x=>x.id===id)||{};
  $('#dt').textContent=id?'編輯':'新增';
  $('#date').value=i.date||today();$('#who').value=i.who||'';$('#item').value=i.item||'';
  $('#jpy').value=i.jpy??'';$('#rate').value=i.rate??(id?'':localStorage.getItem('daishu-rate')||'');
  $('#twd').value=i.twd??'';$('#paid').value=i.paid||'';
  $('#delRow').style.display=id?'flex':'none';
  $('#dlg').showModal();
}
$('#add').onclick=()=>open(null);
$('#cancel').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{
  const who=$('#who').value.trim();
  if(!who){alert('請填待付對象');$('#who').focus();return}
  const jpy=n($('#jpy').value),rate=n($('#rate').value);
  let twd=n($('#twd').value);
  if(jpy!=null&&rate!=null)twd=Math.round(jpy*rate);
  if(twd==null&&jpy==null){alert('請填日幣或台幣金額');return}
  const rec={id:editId||Date.now(),date:$('#date').value||today(),who,item:$('#item').value.trim(),jpy,rate,twd:twd||0,paid:$('#paid').value||''};
  if(rate!=null)try{localStorage.setItem('daishu-rate',rate)}catch(e){}
  editId?items=items.map(x=>x.id===editId?rec:x):items.push(rec);
  store();$('#dlg').close();render();
};
$('#del').onclick=()=>{if(confirm('確定刪除這筆？')){items=items.filter(x=>x.id!==editId);store();$('#dlg').close();render()}};
$('#list').onclick=e=>{
  const p=e.target.closest('[data-pay]');
  if(p){const i=items.find(x=>x.id===+p.dataset.pay);i.paid=today();store();render();return}
  const li=e.target.closest('li');if(li)open(+li.dataset.id);
};
$('#fWho').onchange=$('#fSt').onchange=render;

$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,1)],{type:'application/json'}));
  a.download='daishu-'+today()+'.json';a.click();
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;
    if(confirm(`匯入 ${d.length} 筆，會取代目前資料，確定？`)){items=d;store();render()}}catch(x){alert('檔案格式不正確')}};
  if(e.target.files[0])r.readAsText(e.target.files[0]);e.target.value='';
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
